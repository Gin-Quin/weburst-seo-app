<!doctype html>
<html lang="en" data-theme="weburst">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<style>
			@font-face {
				font-family: "Satoshi";
				src:
					url("/fonts/Satoshi/Satoshi-Variable.woff2") format("woff2"),
					url("/fonts/Satoshi/Satoshi-Variable.woff") format("woff"),
					url("/fonts/Satoshi/Satoshi-Variable.ttf") format("truetype");
				font-weight: 100 900;
				font-style: normal;
				font-display: swap;
			}

			@font-face {
				font-family: "Satoshi";
				src:
					url("/fonts/Satoshi/Satoshi-VariableItalic.woff2") format("woff2"),
					url("/fonts/Satoshi/Satoshi-VariableItalic.woff") format("woff"),
					url("/fonts/Satoshi/Satoshi-VariableItalic.ttf") format("truetype");
				font-weight: 100 900;
				font-style: italic;
				font-display: swap;
			}

			@font-face {
				font-family: "Inter";
				src: url("/fonts/Inter/Inter-VariableFont_opsz,wght.ttf")
					format("truetype");
				font-weight: 100 900;
				font-style: normal;
				font-display: swap;
			}

			@font-face {
				font-family: "Inter";
				src: url("/fonts/Inter/Inter-Italic-VariableFont_opsz,wght.ttf")
					format("truetype");
				font-weight: 100 900;
				font-style: italic;
				font-display: swap;
			}
		</style>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
